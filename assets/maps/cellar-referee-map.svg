  <g font-family="Georgia,serif" fill="#1d2c21" text-anchor="middle"><text x="550" y="57" font-size="34" font-weight="bold">NOWHERE'S END: REFEREE CELLAR</text><text x="550" y="82" font-size="15" letter-spacing="2">ONE SQUARE = 5 FEET • DOTTED = SECRET • GREEN = SEALED STAIR</text>
