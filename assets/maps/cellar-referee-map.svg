  <g font-family="Georgia,serif" fill="#1d2c21" font-size="14"><text x="86" y="765">Doors swing toward their hinge. Casks are difficult terrain; the well is 20 feet deep; the iron chair provides cover.</text><text x="86" y="793">Secret stair: bar to cask vault. Dry passage: gallery to vault. Secret service stair: kitchen to root-chamber.</text></g>
