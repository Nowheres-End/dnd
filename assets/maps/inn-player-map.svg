  <g font-family="Georgia,serif" fill="#1d2c21" text-anchor="middle"><text x="425" y="68" font-size="34" font-weight="bold">NOWHERE'S END</text><text x="425" y="98" font-size="17" letter-spacing="3">A GUEST'S MAP OF THE INN</text><text x="248" y="350" font-size="25">COMMON ROOM</text><text x="248" y="380" font-size="16">fire • clock • seven places</text><text x="492" y="350" font-size="25">BAR</text><text x="492" y="380" font-size="16">four colored bottles</text><text x="666" y="350" font-size="23">GALLERY</text><text x="248" y="565" font-size="25">KITCHEN</text><text x="248" y="595" font-size="16">service door</text><text x="492" y="565" font-size="24">PANTRY</text><text x="666" y="565" font-size="22">VESTIBULE</text><text x="248" y="760" font-size="22">GUEST ROOMS</text><text x="492" y="760" font-size="22">GUEST ROOMS</text><text x="666" y="760" font-size="22">STORAGE</text><text x="425" y="990" font-size="16">North is toward the moor. The road outside has gone missing.</text><text x="425" y="1022" font-size="14" font-style="italic">The guest map records only what a guest is meant to know.</text></g>
